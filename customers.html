<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers — Kridiya Staff Tools</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Great+Vibes&family=Playfair+Display:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<link rel="icon" href="https://kridiyatravel.com/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="https://kridiyatravel.com/assets/favicon-180.png">
<link rel="stylesheet" href="css/site-base.css">
<link rel="stylesheet" href="css/staff.css?v=20260726o">
</head>
<body data-page="customers">
<header id="site-header" class="site-header"></header>
<main>
  <section class="section">
    <div class="container">
      <div id="cust-gate">
        <div class="account-main empty-state"><p>Checking access…</p></div>
      </div>

      <div id="cust-app" hidden>
        <div class="account-head">
          <div>
            <h1>Customers</h1>
            <p>Customer accounts and guest enquiries only, merged by email. Staff and admin login accounts are kept out of this list.</p>
          </div>
          <span class="form-note" id="cust-count"></span>
        </div>

        <div class="stat-row" id="cust-stat-row"></div>

        <div class="account-main customer-control-card">
          <div class="account-section-head">
            <div><h2>Customer portal control</h2><p>Account readiness, guest conversion, booking linkage, and profile cleanup.</p></div>
            <a class="btn btn-outline" href="admin.html">Enquiries</a>
          </div>
          <div id="customer-control-panel"></div>
        </div>

        <div class="account-main admin-filters-card">
          <div class="admin-filters">
            <div class="field customer-search-field">
              <label for="cust-search">SEARCH</label>
              <input id="cust-search" type="text" placeholder="Name, email, phone or reference…" autocomplete="off">
            </div>
            <div class="field">
              <label for="cust-filter">SHOW</label>
              <select id="cust-filter">
                <option value="">Everyone</option>
                <option value="account">Has online account</option>
                <option value="guest">Guests only</option>
                <option value="booked">Has a booking</option>
                <option value="portal_ready">Portal ready</option>
                <option value="portal_needed">Needs portal invite</option>
                <option value="cleanup">Needs cleanup</option>
              </select>
            </div>
            <div class="booking-sort admin-list-sort" id="cust-sort">
              <button type="button" class="booking-sort-btn" id="cust-sort-btn" aria-haspopup="true" aria-expanded="false" data-command-label="Sort customers" data-command-desc="Open customer sort menu" data-command-keys="F" data-command-action="focus-filter">Sort: <b>Recent activity</b></button>
              <div class="booking-sort-menu" id="cust-sort-menu" role="menu" hidden>
                <button type="button" role="menuitemradio" aria-checked="true" class="booking-sort-item active" data-sort="recent_desc"><span class="sort-dot"></span><span><b>Recent activity</b><small>Latest contact first</small></span></button>
                <button type="button" role="menuitemradio" aria-checked="false" class="booking-sort-item" data-sort="name_asc"><span class="sort-dot"></span><span><b>Name</b><small>A to Z</small></span></button>
                <button type="button" role="menuitemradio" aria-checked="false" class="booking-sort-item" data-sort="bookings_desc"><span class="sort-dot"></span><span><b>Bookings</b><small>Most bookings first</small></span></button>
                <button type="button" role="menuitemradio" aria-checked="false" class="booking-sort-item" data-sort="portal_first"><span class="sort-dot"></span><span><b>Portal action</b><small>Invite and cleanup first</small></span></button>
              </div>
            </div>
          </div>
        </div>

        <div id="cust-list"></div>
      </div>
    </div>
  </section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="https://kridiyatravel.com/js/auth.js" defer></script>
<script src="js/staff-common.js?v=20260726c" defer></script>
<script src="js/customers.js?v=20260726b" defer></script>
</body>
</html>
