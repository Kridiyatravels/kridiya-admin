<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Great+Vibes&family=Playfair+Display:ital,wght@1,700;1,800&display=swap" rel="stylesheet">

<body data-page="profile">
<header id="site-header" class="site-header"></header>
<main><section class="section"><div class="container">
  <div id="profile-gate"><div class="account-main empty-state"><p>Checking access...</p></div></div>
  <div id="profile-app" hidden>
    <div class="account-head"><div><h1>My Profile</h1><p>Your account, role, and what you are allowed to do in Kridiya Staff Tools.</p></div></div>
    <div id="profile-identity"></div>
    <div class="ops-grid ops-grid-2">
      <div class="account-main"><div class="account-section-head"><div><h2>Account details</h2><p>Your sign-in and staff record.</p></div></div><div id="profile-account"></div></div>
      <div class="account-main"><div class="account-section-head"><div><h2>Security</h2><p>Keep your account safe.</p></div></div><div id="profile-security"></div></div>
    </div>
    <div class="account-main"><div class="account-section-head"><div><h2>My access</h2><p>What you can and cannot do. Only an owner/admin can change this.</p></div></div><div id="profile-permissions"></div></div>
  </div>
</div></section></main>
<footer id="site-footer" class="site-footer"></footer>
<script src="https://kridiyatravel.com/js/auth.js" defer></script>
<script src="js/staff-common.js" defer></script>
